name: Accessibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run accessibility gate (Playwright + axe-core, modeled on GitHub Primer's aat-reports.yml)
        id: a11y_check
        # set -o pipefail: without it, this step's exit code is tee's (always 0),
        # not node's — the pipe would silently report "success" on real violations.
        # NO_COLOR/FORCE_COLOR=0: keeps a11y-report.txt free of ANSI escape codes —
        # they render as garbage once pasted into a plain-text GitHub issue body.
        # Only this script's own output is captured, not the (much noisier,
        # colorized) Storybook build log above.
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set -o pipefail
          node scripts/check-accessibility.mjs 2>&1 | tee a11y-report.txt
        continue-on-error: true

      # File/update a GitHub Issue on failure instead of triggering an agent to
      # auto-fix — deliberate choice, no LLM call = no cost. See Playbook Step 6d
      # for the full reasoning. Fixing stays a human- (or manually agent-)
      # initiated step, same as everyone else in the comparison research
      # (Primer's own "safe outputs" still need a manual apply step).
      - name: File or update an issue on accessibility violations
        if: steps.a11y_check.outcome == 'failure' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label a11y-violation --state open --json number --jq '.[0].number')
          BODY=$(printf '%s\n\n```\n%s\n```\n\nAutomatisch erstellt vom Accessibility-Workflow (Run: %s).' \
            "Der automatisierte Accessibility-Check ist fehlgeschlagen." \
            "$(cat a11y-report.txt)" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Accessibility violation(s) found" --label a11y-violation --body "$BODY"
          fi

      - name: Fail the job if the accessibility gate failed
        if: steps.a11y_check.outcome == 'failure'
        run: exit 1
