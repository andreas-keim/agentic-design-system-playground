name: Accessibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # needed to push screenshots to the a11y-screenshots hosting branch
  issues: write

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run accessibility gate (Playwright + axe-core, modeled on GitHub Primer's aat-reports.yml)
        id: a11y_check
        # set -o pipefail: without it, this step's exit code is tee's (always 0),
        # not node's — the pipe would silently report "success" on real violations.
        # NO_COLOR/FORCE_COLOR=0: keeps stdout free of ANSI escape codes, which
        # would render as garbage in a plain-text GitHub issue. The script's own
        # a11y-summary.md (human-first: headline, screenshot, plain language) is
        # what actually becomes the issue body — see Playbook Step 6g. Only this
        # script's stdout is captured here, not the noisier Storybook build log.
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
          SCREENSHOT_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/a11y-screenshots/run-${{ github.run_id }}
        run: |
          set -o pipefail
          node scripts/check-accessibility.mjs 2>&1 | tee a11y-report.txt
        continue-on-error: true

      # Screenshots need a stable public URL to embed in a GitHub Issue — commit
      # them to a dedicated orphan branch (never merged into main, just used as
      # cheap static-file hosting via raw.githubusercontent.com) instead of
      # polluting main's history with binary PNGs on every run.
      - name: Publish screenshots
        id: publish_screenshots
        if: steps.a11y_check.outcome == 'failure' && github.event_name == 'push'
        continue-on-error: true # a screenshot-hosting hiccup shouldn't also swallow the issue notification below
        run: |
          mkdir -p /tmp/a11y-screenshots-branch
          cd /tmp/a11y-screenshots-branch
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Two runs finishing close together race for the same branch tip —
          # our own commit only ever adds a new run-<id>/ folder, never touches
          # an existing one, so on a rejected push it's always safe to just
          # fetch the latest tip and recommit on top of it. A few retries turn
          # a same-minute race into a brief delay instead of a silently lost
          # screenshot upload.
          # Keep only the most recent KEEP_RUNS run-<id>/ folders — otherwise
          # this branch (and every future `git fetch` of it) grows forever,
          # one PNG folder per failing run, with nothing ever removed.
          KEEP_RUNS=30

          attempt=1
          max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            if git fetch -q origin a11y-screenshots 2>/dev/null; then
              git checkout -q a11y-screenshots
            else
              git checkout -q --orphan a11y-screenshots
            fi
            rm -rf "run-${{ github.run_id }}"
            mkdir -p "run-${{ github.run_id }}"
            cp "$GITHUB_WORKSPACE"/a11y-screenshots/*.png "run-${{ github.run_id }}/"

            ls -d run-*/ 2>/dev/null \
              | sed -e 's#^run-##' -e 's#/$##' \
              | sort -n \
              | head -n "-$KEEP_RUNS" \
              | while read -r old_run_id; do rm -rf "run-$old_run_id"; done

            git add -A
            git -c user.name="github-actions" -c user.email="github-actions@github.com" commit -q -m "a11y screenshots for run ${{ github.run_id }} (prune old runs beyond $KEEP_RUNS)"
            if git push -q origin a11y-screenshots; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/$max_attempts), retrying..."
            attempt=$((attempt + 1))
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Could not publish screenshots after $max_attempts attempts."
          exit 1

      # `gh issue create --label` fails outright if the label doesn't exist yet
      # (verified live: exit 1, "could not add label ... not found", no issue
      # created at all) — provision it here so this workflow is reproducible on
      # a fresh fork/clone instead of silently depending on a one-off manual
      # `gh label create` someone ran once outside the pipeline.
      - name: Ensure the a11y-violation label exists
        if: steps.a11y_check.outcome == 'failure' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create a11y-violation --repo "$GITHUB_REPOSITORY" --description "Automatisch vom Accessibility-CI-Gate erstellt" --color "d93f0b" --force

      # File/update a GitHub Issue on failure instead of triggering an agent to
      # auto-fix — deliberate choice, no LLM call = no cost. See Playbook Step 6d
      # for the full reasoning. Fixing stays a human- (or manually agent-)
      # initiated step, same as everyone else in the comparison research
      # (Primer's own "safe outputs" still need a manual apply step).
      - name: File or update an issue on accessibility violations
        if: steps.a11y_check.outcome == 'failure' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label a11y-violation --state open --json number --jq '.[0].number')
          SCREENSHOT_NOTE=""
          if [ "${{ steps.publish_screenshots.outcome }}" = "failure" ]; then
            SCREENSHOT_NOTE=$'\n\n⚠️ Screenshots konnten diesmal nicht veröffentlicht werden — Bild-Links unten sind möglicherweise tot.'
          fi
          BODY=$(printf '%s%s\n\n---\n\nAutomatisch erstellt vom Accessibility-Workflow (Run: %s).' \
            "$(cat a11y-summary.md)" \
            "$SCREENSHOT_NOTE" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Accessibility violation(s) found" --label a11y-violation --body "$BODY"
          fi

      - name: Fail the job if the accessibility gate failed
        if: steps.a11y_check.outcome == 'failure'
        run: exit 1
